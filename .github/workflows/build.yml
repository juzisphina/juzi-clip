name: Build apps

# Push a tag like v1.2.3 -> build Mac + Windows, test both for real, publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest   # Apple silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: |
          pip install certifi
          python -m unittest discover -s tests -t . -v

      - name: Network routes (system proxy, HTTP/SOCKS5 ports, fallbacks)
        run: python tests/net_check.py

      - name: Build JuziClip.app
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
        run: |
          pip install pyinstaller==6.11.1 pywebview==5.4 certifi
          export APP_VERSION="${APP_VERSION#v}"
          pyinstaller --noconfirm ClipSaver.spec

      - name: Test the packaged app on this Mac (real downloads)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          CLIPSAVER_NO_BROWSER=1 CLIPSAVER_DIR="$RUNNER_TEMP/out" \
            dist/JuziClip.app/Contents/MacOS/JuziClip &
          python tests/smoke_live.py http://127.0.0.1:8796 "$RUNNER_TEMP/out"
          curl -s -X POST -d '{}' http://127.0.0.1:8796/api/quit
          sleep 2

      - name: Test the app window opens and closes (Mac)
        run: python tests/window_check.py dist/JuziClip.app/Contents/MacOS/JuziClip

      - name: Make dmg (drag JuziClip into Applications)
        run: |
          mkdir -p dmg
          cp -R dist/JuziClip.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname JuziClip -srcfolder dmg -fs HFS+ -format UDZO -ov dist/JuziClip-macOS-arm64.dmg
          hdiutil verify dist/JuziClip-macOS-arm64.dmg
          # open the dmg like a user would and check what is inside
          hdiutil attach -nobrowse -mountpoint /tmp/cs dist/JuziClip-macOS-arm64.dmg
          test -x /tmp/cs/JuziClip.app/Contents/MacOS/JuziClip
          test -L /tmp/cs/Applications
          hdiutil detach /tmp/cs
          ls -la dist/JuziClip-macOS-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/JuziClip-macOS-arm64.dmg

  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8   # test scripts print Chinese
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: |
          pip install certifi
          python -m unittest discover -s tests -t . -v

      - name: Network routes (system proxy, HTTP/SOCKS5 ports, fallbacks)
        run: python tests/net_check.py

      - name: Build JuziClip.exe
        run: |
          pip install pyinstaller==6.11.1 pywebview==5.4 certifi
          pyinstaller --noconfirm --onefile --noconsole --name JuziClip \
            --icon art/ClipSaver.ico \
            --add-data "clipsaver/ui.html;clipsaver" \
            --add-data "clipsaver/logo.png;clipsaver" \
            --exclude-module tkinter --exclude-module unittest \
            main.py
          mv dist/JuziClip.exe dist/JuziClip-Windows.exe
          ls -la dist

      - name: Test the packaged exe on Windows (real downloads)
        run: |
          OUT="$RUNNER_TEMP\\out"
          mkdir -p "$OUT"
          CLIPSAVER_NO_BROWSER=1 CLIPSAVER_DIR="$OUT" dist/JuziClip-Windows.exe &
          python tests/smoke_live.py http://127.0.0.1:8796 "$OUT"
          curl -s -X POST -d '{}' http://127.0.0.1:8796/api/quit
          sleep 2

      - name: Test the app window opens and closes (Windows)
        run: python tests/window_check.py dist/JuziClip-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/JuziClip-Windows.exe

  release:
    if: github.ref_type == 'tag'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "${{ github.ref_name }}" out/JuziClip-macOS-arm64.dmg out/JuziClip-Windows.exe \
            --title "橘子存片 JuziClip ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
